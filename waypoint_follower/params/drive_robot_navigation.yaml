/localization_lifecycle_manager:
  ros__parameters:
    autostart: True
    use_sim_time: True
    bond_timeout: 8.0
    node_names: ['map_server', 'amcl']
    attempt_respawn_reconnection: True
    bond_respawn_max_duration: 15.0
    service_introspection_mode: "disabled"
    allow_parameter_qos_overrides: True

/planner_lifecycle_manager:
  ros__parameters:
    autostart: True
    use_sim_time: True
    bond_timeout: 8.0
    node_names: ['nav2_goal_planner','nav2_controller_server','nav2_behavior_server','bt_navigator']
    service_introspection_mode: "disabled"

/amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    base_frame_id: base_footprint
    do_beamskip: False
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 5.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 1000
    min_particles: 300
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: True
    transform_tolerance: 0.5
    service_introspection_mode: "disabled"
    update_min_a: 0.15
    update_min_d: 0.15
    z_hit: 0.5
    z_rand: 0.5
    scan_topic: /scan
    map_topic: /map
    always_reset_initial_pose: False
    first_map_only: False
    bond_heartbeat_period: 0.5
    allow_parameter_qos_overrides: True
    set_initial_pose: True
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
      z: 0.0

global_costmap:  
  global_costmap:  
    ros__parameters:
      use_sim_time: True
      footprint: "[[0.17, 0.16], [0.17, -0.16], [-0.15, -0.16], [-0.15, 0.16]]"
      footprint_padding: 0.01
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 24.0
      publish_frequency: 24.0
      resolution: 0.1
      lethal_cost_threshold: 80
      map_vis_z: -0.008
      transform_tolerance: 2.0
      observation_sources: scan
      initial_transform_timeout: 90.0
      trinary_costmap: True
      unknown_cost_value: 255
      track_unknown_space: True
      origin_x: 0.0
      origin_y: 0.0
      height: 16
      width: 16
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        map_subscribe_transient_local: True
        transform_tolerance: 2.0
        map_topic: "/map"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 1
        tf_filter_tolerance: 2.5
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: lidar_link
          expected_update_rate: 30.0
          observation_persistence: 1.0
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          inf_is_valid: False
          marking: True
          clearing: True
          obstacle_max_range: 3.5
          obstacle_min_range: 0.01
          raytrace_max_range: 3.5
          raytrace_min_range: 0.01
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.2
        cost_scaling_factor: 5.0
        inflate_unknown: False
        inflate_around_unknown: False
      always_send_full_costmap: True

local_costmap:  
  local_costmap:
    ros__parameters:
      footprint: "[[0.17, 0.16], [0.17, -0.16], [-0.15, -0.16], [-0.15, 0.16]]"
      footprint_padding: 0.01
      update_frequency: 24.0
      publish_frequency: 24.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: True
      width: 5
      height: 5
      resolution: 0.1
      map_vis_z: -0.008
      observation_sources: scan
      service_introspection_mode: "disabled"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        max_obstacle_height: 2.0
        footprint_clearing_enabled: True
        combination_method: 1
        tf_filter_tolerance: 4.0
        observation_persistence: 1.0
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: lidar_link
          expected_update_rate: 30.0
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          inf_is_valid: True
          marking: True
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          raytrace_max_range: 3.5
          raytrace_min_range: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.165
        cost_scaling_factor: 5.0
        inflate_unknown: False
        inflate_around_unknown: False

/nav2_goal_planner:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 7.0
    costmap_update_timeout: 1.0
    bond_heartbeat_period: 0.5
    introspection_mode: "disabled"
    planner_plugins: ["GridBased"]
    GridBased:  
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      allow_unknown: True
      use_final_approach_orientation: True

/nav2_controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 13.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    odom_topic: /odometry/filtered
    enable_stamped_cmd_vel: False
    bond_heartbeat_period: 0.5
    introspection_mode: "disabled"
    use_realtime_priority: False
    publish_zero_velocity: True
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      #Rotation shim controller
      angular_dist_threshold: 0.314
      angular_disengage_threshold: 0.157
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 1.0
      simulate_ahead_time: 2.0
      rotate_to_goal_heading: true
      #DWB controller
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"
      goal_checker_name: "deb_plugins::SimpleGoalChecker"
      #XYTheta Iterator
      vx_samples: 20
      vy_samples: 10
      vtheta_samples: 20
      #Kinetic Parameters
      max_vel_theta: 0.4
      min_speed_xy: 0.0
      max_speed_xy: 0.75
      min_speed_theta: 0.0
      min_vel_x: 0.05
      min_vel_y: 0.0
      # min_vel_theta: -1.57
      max_vel_x: 0.8
      max_vel_y: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_li_theta: 1.0
      decel_lim_x: -2.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      #Publisher
      publish_evaluation: True
      publish_global_plan: True
      publish_transformed_plan: False
      publish_local_plan: True
      publish_trajectories: True
      publish_cost_grid_pc: False
      marker_lifetime: 0.2
      #Standard Trajectory Generator
      sim_time: 1.7
      discretize_by_time: False
      time_granularity: 0.5
      linear_granularity: 0.5
      angular_granularity: 0.5
      include_last_point: True
      limit_vel_cmd_in_traj: False
      stateful: True
      # Critics and their parameters
      critics: ["BaseObstacle", "GoalAlign", "GoalDist", "ObstacleFootprint", "Oscillation", "PathAlign", "PathDist", "RotateToGoal"]
      BaseObstacle:
        scale: 1.0
        sum_scores: False
      GoalAlign:
        forward_point_distance: 0.314
        aggregation_type: "last"
        scale: 20.0
      GoalDist:
        aggregation_type: "last"
        scale: 20.0
      ObstacleFootprint:
        sum_scores: False
        scale: 10.0
      Oscillation:
        oscillation_reset_dist: 0.05
        oscillation_reset_angle: 0.5
        oscillation_reset_time: 8.0
        x_only_threshold: 0.05
        scale: 5.0
      PathAlign:
        forward_point_distance: 0.325
        aggregation_type: "last"
        scale: 15.0
      PathDist:
        aggregation_type: "last"
        scale: 15.0
      RotateToGoal:
        xy_goal_tolerance: 0.14
        trans_stopped_velocity: 0.1
        slowing_factor: 7.0
        lookahead_time: 2.0
        scale: 10.0
    progress_checker: 
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.4
      movement_time_allowance: 13.0
    goal_checker: 
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.4
      stateful: False

/nav2_behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: /local_costmap/costmap_raw
    global_costmap_topic: /global_costmap/costmap_raw
    local_footprint_topic: /local_costmap/published_footprint
    global_footprint_topic: /global_costmap/published_footprint
    cycle_frequency: 10.0
    transform_tolerance: 1.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    service_introspection_mode: "disabled"
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
      simulate_ahead_time: 2.0
      max_rotational_vel: 1.0
      min_rotational_vel: 0.4
      rotational_acc_lim: 3.2
      enable_stamped_cmd_vel: False
    backup:
      plugin: "nav2_behaviors::BackUp"
      simulate_ahead_time: 2.0
      enable_stamped_cmd_vel: False
      accelaration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.10
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      simulate_ahead_time: 2.0
      enable_stamped_cmd_vel: False
      bond_heartbeat_period: 0.5
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.10
    wait:
      plugin: "nav2_behaviors::Wait"

/bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    filter_duration: 1.0
    introspection_mode: "disabled"
    always_reload_bt_xml: False
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    default_nav_to_pose_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_path_error_code
      - follow_path_path_error_code
      - spin_path_error_code
